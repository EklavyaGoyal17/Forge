name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21, Maven, Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Docker is available on GitHub-hosted Ubuntu runners, so the PostgreSQL integration tests run here.
      - run: mvn -B -ntp verify
      - name: Report failed tests as annotations
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('**/target/surefire-reports/TEST-*.xml', recursive=True):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for kind in ('failure', 'error'):
                      for el in tc.findall(kind):
                          msg = ' '.join(((el.get('message') or '') + ' ' + (el.text or '')).split())[:900]
                          print(f"::error title={tc.get('classname')}.{tc.get('name')}::{kind}: {msg}")
          EOF
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'

  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: forge-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: forge-ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Hardened container, end to end
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the compose stack (waits for health checks)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Verify the containers' isolation settings at runtime
        run: bash scripts/verify_isolation.sh
      - name: Every scenario through the API, the UI, investigator and challenges
        run: python3 scripts/e2e_smoke.py http://127.0.0.1:8090 --expect-runner-container
      - if: failure()
        run: docker compose logs --no-color | tail -400
      - if: always()
        run: docker compose down -v
